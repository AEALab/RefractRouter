<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t d">
  <title id="t">Advisor Gate 的审核闭环</title>
  <desc id="d">固定执行器产出候选；首次审核通过即交付，REDO 触发一次返工并复审；第二次未通过或无法判断则停止。</desc>
  <defs><marker id="aa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#8aa297" stroke-width="1.6"/></marker></defs>
  <g font-family="system-ui,-apple-system,sans-serif">
    <rect x="60" y="16" width="200" height="52" rx="9" fill="#fff" stroke="#c9d8d0"/>
    <text x="160" y="38" font-size="13" font-weight="650" fill="#243b31" text-anchor="middle">固定执行器生成候选</text>
    <text x="160" y="56" font-size="11" fill="#52605b" text-anchor="middle">正常工具请求直接放行</text>
    <rect x="60" y="100" width="200" height="52" rx="9" fill="#fff" stroke="#c9d8d0"/>
    <text x="160" y="122" font-size="13" font-weight="650" fill="#243b31" text-anchor="middle">最终候选缓冲</text>
    <text x="160" y="140" font-size="11" fill="#52605b" text-anchor="middle">文本与工具调用均不闪现</text>
    <rect x="330" y="100" width="200" height="52" rx="9" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="430" y="122" font-size="13" font-weight="650" fill="#176e51" text-anchor="middle">首次审核</text>
    <text x="430" y="140" font-size="11" fill="#3f725a" text-anchor="middle">APPROVE / REDO / UNRESOLVED</text>
    <rect x="600" y="100" width="140" height="52" rx="9" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="670" y="122" font-size="13" font-weight="650" fill="#176e51" text-anchor="middle">交付</text>
    <text x="670" y="140" font-size="11" fill="#3f725a" text-anchor="middle">标记审核通过</text>
    <rect x="330" y="196" width="200" height="60" rx="9" fill="#fff7e9" stroke="#e1cbaa"/>
    <text x="430" y="218" font-size="13" font-weight="650" fill="#7c602f" text-anchor="middle">REDO：丢弃候选</text>
    <text x="430" y="238" font-size="11" fill="#886e45" text-anchor="middle">保存反馈 · 原执行器修正</text>
    <text x="430" y="252" font-size="11" fill="#886e45" text-anchor="middle">返工中的工具请求由宿主正常执行</text>
    <rect x="330" y="292" width="200" height="52" rx="9" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="430" y="314" font-size="13" font-weight="650" fill="#176e51" text-anchor="middle">复审（第二次）</text>
    <text x="430" y="332" font-size="11" fill="#3f725a" text-anchor="middle">核对前次反馈与新问题</text>
    <rect x="60" y="292" width="200" height="52" rx="9" fill="#fff7e9" stroke="#e1cbaa"/>
    <text x="160" y="314" font-size="13" font-weight="650" fill="#7c602f" text-anchor="middle">未审定停止</text>
    <text x="160" y="332" font-size="11" fill="#886e45" text-anchor="middle">不交付未通过候选</text>
    <rect x="60" y="380" width="640" height="40" rx="8" fill="#f2f7f4" stroke="#c9d8d0"/>
    <text x="380" y="405" font-size="11" fill="#52605b" text-anchor="middle">所有被丢弃候选、Judge 调用与返工均计入生产费用；最多 2 次审核 + 1 次返工，不会无限循环</text>
    <path d="M160 68v28" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#aa2)"/>
    <path d="M264 126h60" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#aa2)"/>
    <path d="M536 126h56" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#aa2)"/>
    <path d="M430 156v34" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#aa2)"/>
    <path d="M430 262v26" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#aa2)"/>
    <path d="M530 318 C 620 318, 670 240, 670 156" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#aa2)"/>
    <path d="M330 318h70" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#aa2)"/>
  </g>
</svg>
