<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Python 核心与 DSH 插件的分层职责</title>
  <desc id="desc">四层结构：宿主 Agent 层负责工具与任务推进；插件层只做协议转换与展示；Python 核心层负责策略、准入、账本与证据；模型层是用户配置的实际 provider。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10" fill="none" stroke="#8aa297" stroke-width="1.6"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,sans-serif">
    <!-- 宿主层 -->
    <rect x="20" y="16" width="720" height="86" rx="10" fill="#f2f7f4" stroke="#c9d8d0"/>
    <text x="36" y="42" font-size="15" font-weight="700" fill="#243b31">宿主 Agent 层（DSH 原生循环 / Codex CLI）</text>
    <text x="36" y="66" font-size="12" fill="#52605b">工具执行 · 权限与审批 · 技能与提示组织 · 上下文压缩 · 子 Agent 与后台生命周期</text>
    <text x="36" y="88" font-size="12" fill="#8aa297">这一层完全属于接入方，Router 不进入、不复制、不替代</text>

    <!-- 插件层 + 网关 -->
    <rect x="20" y="126" width="352" height="100" rx="10" fill="#fff" stroke="#d0ddd6"/>
    <text x="36" y="152" font-size="15" font-weight="700" fill="#243b31">DSH 插件（TypeScript）</text>
    <text x="36" y="176" font-size="12" fill="#52605b">宿主适配 · 设置卡片 · 轨迹与 DAG 展示</text>
    <text x="36" y="196" font-size="12" fill="#52605b">启动 Python 工作进程 · 传递模型调用与凭证边界</text>
    <text x="36" y="216" font-size="11" fill="#8aa297">不计算路由、评分、预算或 Go/No-go</text>

    <rect x="388" y="126" width="352" height="100" rx="10" fill="#fff" stroke="#d0ddd6"/>
    <text x="404" y="152" font-size="15" font-weight="700" fill="#243b31">标准模型网关（HTTP，可选）</text>
    <text x="404" y="176" font-size="12" fill="#52605b">Base URL 接入 Codex 等客户端</text>
    <text x="404" y="196" font-size="12" fill="#52605b">refract/static 等 6 个虚拟模型</text>
    <text x="404" y="216" font-size="11" fill="#8aa297">标准 API 不隐式进入 DAG</text>

    <!-- Python 核心 -->
    <rect x="20" y="250" width="720" height="100" rx="10" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="36" y="276" font-size="16" font-weight="700" fill="#176e51">RefractRouter Python 核心（策略与账本的唯一权威）</text>
    <text x="36" y="300" font-size="12" fill="#3f725a">六策略状态机 · 自动路由 Direct/DAG 求解 · Judge 合同与结果校验 · 模型准入</text>
    <text x="36" y="320" font-size="12" fill="#3f725a">原子预算预留与结算 · 数据域检查 · 运行证据持久化 · 路由轨迹</text>
    <text x="36" y="340" font-size="11" fill="#5d8d77">同一套核心同时服务插件与网关，目录、价格、预算规则只编译一次</text>

    <!-- 模型层 -->
    <rect x="20" y="374" width="720" height="38" rx="8" fill="#fff7e9" stroke="#e1cbaa"/>
    <text x="36" y="398" font-size="13" font-weight="650" fill="#7c602f">用户配置的模型服务：Ark / Kimi / DeepSeek / 其他 provider · Judge 后端（LLM · Jev · 本地 Laya）</text>

    <!-- 箭头 -->
    <path d="M376 102v22" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M564 102v22" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M196 226v22" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M564 226v22" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M380 350v22" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <text x="396" y="368" font-size="11" fill="#8aa297">按策略选定的实际调用</text>
  </g>
</svg>
