<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">Stage 策略的逐轮决策</title>
  <desc id="d">Stage 根据最近窗口内的可信工具证据计算规则信号；重复失败触发强模型接管，保持期结束后恢复高效模型。</desc>
  <defs><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#8aa297" stroke-width="1.6"/></marker></defs>
  <g font-family="system-ui,-apple-system,sans-serif">
    <rect x="280" y="14" width="200" height="52" rx="9" fill="#fff" stroke="#c9d8d0"/>
    <text x="380" y="38" font-size="14" font-weight="650" fill="#243b31" text-anchor="middle">本轮工具证据到达</text>
    <text x="380" y="56" font-size="11" fill="#52605b" text-anchor="middle">去重后取最近 3 条有效事件</text>
    <rect x="250" y="94" width="260" height="64" rx="9" fill="#fff7e9" stroke="#e1cbaa"/>
    <text x="380" y="117" font-size="13" font-weight="650" fill="#7c602f" text-anchor="middle">优先级一：未确认 / 基础设施故障</text>
    <text x="380" y="137" font-size="11" fill="#886e45" text-anchor="middle">停止后续受管调用，不猜测结果</text>
    <text x="380" y="153" font-size="11" fill="#886e45" text-anchor="middle">权限拒绝不升级，只重置计数</text>
    <rect x="250" y="186" width="260" height="56" rx="9" fill="#fff" stroke="#c9d8d0"/>
    <text x="380" y="208" font-size="13" font-weight="650" fill="#243b31" text-anchor="middle">优先级二：新的同类重复失败</text>
    <text x="380" y="228" font-size="11" fill="#52605b" text-anchor="middle">同工具 · 同参数指纹 · 可信失败信息</text>
    <rect x="250" y="270" width="260" height="56" rx="9" fill="#fff" stroke="#c9d8d0"/>
    <text x="380" y="292" font-size="13" font-weight="650" fill="#243b31" text-anchor="middle">优先级三：规则信号</text>
    <text x="380" y="312" font-size="11" fill="#52605b" text-anchor="middle">tanh(0.5 × (失败密度 + 空转 − 生产)) 与阈值比较</text>
    <rect x="60" y="360" width="180" height="48" rx="9" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="150" y="381" font-size="13" font-weight="650" fill="#176e51" text-anchor="middle">切换强执行模型</text>
    <text x="150" y="399" font-size="11" fill="#3f725a" text-anchor="middle">保持 2 轮（含本轮）</text>
    <rect x="520" y="360" width="180" height="48" rx="9" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="610" y="381" font-size="13" font-weight="650" fill="#176e51" text-anchor="middle">高效模型继续</text>
    <text x="610" y="399" font-size="11" fill="#3f725a" text-anchor="middle">信号模糊或无新证据</text>
    <path d="M380 66v24" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ga)"/>
    <path d="M380 158v24" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ga)"/>
    <path d="M380 242v24" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ga)"/>
    <path d="M290 326c-60 10 -110 20 -120 30" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ga)"/>
    <path d="M470 326c60 10 110 20 120 30" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ga)"/>
    <text x="380" y="352" font-size="11" fill="#8aa297" text-anchor="middle">保持期结束且无新困难 → 恢复高效模型</text>
  </g>
</svg>
