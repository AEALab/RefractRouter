<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc"><title id="title">规划路由一次调用的旅程</title><desc id="desc">DSH 原生循环发起请求，插件转发给 Python 核心；核心选模并预留预算后签发调用，模型流式返回，工具交回 DSH 执行，费用与判别写入证据文件，工具证据随下一轮请求回到核心。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#789187" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,sans-serif">
<rect x="80" y="20" width="460" height="44" rx="9" fill="#fff" stroke="#d0ddd6"/><text x="310" y="47" text-anchor="middle" font-size="13" fill="#243b31">① DSH 原生循环发起模型请求，插件转发给本机核心</text>
<path d="M310 66v10" stroke="#789187" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="78" width="460" height="44" rx="9" fill="#e0f1e9" stroke="#81baa4"/><text x="310" y="105" text-anchor="middle" font-size="13" fill="#176e51">② 核心按冻结任务状态与策略选模，原子预留预算</text>
<path d="M310 124v10" stroke="#789187" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="136" width="460" height="44" rx="9" fill="#e0f1e9" stroke="#81baa4"/><text x="310" y="163" text-anchor="middle" font-size="13" fill="#176e51">③ 核心签发调用指令，插件交给 DSH 模型服务</text>
<path d="M310 182v10" stroke="#789187" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="194" width="460" height="44" rx="9" fill="#fff" stroke="#d0ddd6"/><text x="310" y="221" text-anchor="middle" font-size="13" fill="#243b31">④ 模型流式返回；工具调用原样交回 DSH 审批执行</text>
<path d="M310 240v10" stroke="#789187" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="252" width="460" height="44" rx="9" fill="#fff" stroke="#d0ddd6"/><text x="310" y="279" text-anchor="middle" font-size="13" fill="#243b31">⑤ 费用、判别、接受或丢弃写入本机证据文件</text>
<path d="M540 274h50V42h-50" fill="none" stroke="#91a69d" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="140" font-size="11" fill="#62776d">结构化工具证据</text>
<text x="600" y="156" font-size="11" fill="#62776d">随下一轮请求</text>
<text x="600" y="172" font-size="11" fill="#62776d">回到核心，决定</text>
<text x="600" y="188" font-size="11" fill="#62776d">下一轮模型</text>
<text x="80" y="312" font-size="11" fill="#62776d">绿色两步在 Python 核心完成；宿主工具语义不进入核心，核心只消费证据状态。</text>
</g></svg>
