[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "refractrouter"
version = "0.13.0"
description = "Task routing with local or persistent HTTP RefractAgent execution and DSH integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
deepagents = [
  "deepagents>=0.7,<0.8",
  "langgraph>=1.2,<1.3",
]
analysis = [
    "matplotlib>=3.10,<3.11",
]
local-judge = [
    "laya-mlx==0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
refractrouter = "refractrouter.cli:main"
refractagent = "refractrouter.agent_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refractrouter = ["resources/*.json"]

[tool.setuptools.data-files]
"share/refractrouter" = ["data/model-profiles-v1.json", "data/model-profiles-v2.json", "data/currency-rates-v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
