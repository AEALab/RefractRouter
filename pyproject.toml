[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "refractrouter"
version = "0.1.0"
description = "Task-decomposition-aware heterogeneous LLM routing research harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
deepagents = [
  "deepagents>=0.7,<0.8",
  "langgraph>=1.2,<1.3",
]

[project.scripts]
refractrouter = "refractrouter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
