<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 192" role="img" aria-labelledby="title desc"><title id="title">Agent、Router 与模型的职责</title><desc id="desc">DSH 或 Codex 的 Agent 调用 RefractRouter，Router 选择模型；工具、审批、上下文和任务推进由 Agent 保持。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#789187" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,sans-serif"><rect x="0" y="15" width="200" height="100" rx="9" fill="#fff" stroke="#d0ddd6"/><text x="100" y="49" text-anchor="middle" font-size="18" font-weight="650" fill="#243b31">DSH / Codex Agent</text><text x="100" y="77" text-anchor="middle" font-size="13" fill="#62776d">原生执行循环</text><text x="100" y="98" text-anchor="middle" font-size="11" fill="#62776d">工具 · 权限 · 上下文 · 任务推进</text><path d="M207 65h43" stroke="#789187" stroke-width="2" marker-end="url(#arrow)"/><rect x="258" y="15" width="206" height="100" rx="9" fill="#e0f1e9" stroke="#81baa4"/><text x="361" y="49" text-anchor="middle" font-size="19" font-weight="650" fill="#176e51">RefractRouter</text><text x="361" y="78" text-anchor="middle" font-size="13" fill="#3f725a">选模 · 判别 · 费用 · 轨迹</text><text x="361" y="99" text-anchor="middle" font-size="11" fill="#3f725a">Python 独立核心</text><path d="M472 65h43" stroke="#789187" stroke-width="2" marker-end="url(#arrow)"/><rect x="526" y="15" width="193" height="100" rx="9" fill="#fff" stroke="#d0ddd6"/><text x="622" y="49" text-anchor="middle" font-size="18" font-weight="650" fill="#243b31">团队配置的模型</text><text x="622" y="78" text-anchor="middle" font-size="13" fill="#62776d">Ark · Kimi · DeepSeek</text><text x="622" y="99" text-anchor="middle" font-size="11" fill="#62776d">其他已配置的实际 provider</text><path d="M361 124v20H100v-20" fill="none" stroke="#91a69d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="361" y="172" text-anchor="middle" font-size="12" fill="#62776d">模型回复与工具调用交还 Agent；Router 不代替 Agent 执行工具</text></g></svg>
