<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" role="img" aria-labelledby="title desc"><title id="title">自动路由的 Direct 与 DAG</title><desc id="desc">任务经过是否拆分的有限判别和 Python 准入；可以直接执行或规划 DAG，再按任务风险和实际证据决定最终审核。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 10 5-10 5" fill="#789187"/></marker></defs><g font-family="system-ui,-apple-system,sans-serif" text-anchor="middle"><g fill="none" stroke="#91a69d" stroke-width="1.5" marker-end="url(#a)"><path d="M156 128h33"/><path d="M347 128h30V48h35"/><path d="M377 128v83h35"/><path d="M578 48h22v80h30"/><path d="M578 211h22v-83"/></g><rect x="1" y="86" width="154" height="84" rx="8" fill="#fff" stroke="#d0ddd6"/><text x="78" y="120" font-size="17" font-weight="650" fill="#243b31">用户任务</text><text x="78" y="147" font-size="12" fill="#62776d">要求 · 输入 · 预算</text><rect x="197" y="79" width="150" height="98" rx="8" fill="#e0f1e9" stroke="#81baa4"/><text x="272" y="112" font-size="16" font-weight="650" fill="#176e51">判断与准入</text><text x="272" y="139" font-size="12" fill="#3f725a">规则 / 可选 Jev</text><text x="272" y="160" font-size="11" fill="#3f725a">最终路线由 Python 决定</text><rect x="420" y="13" width="157" height="70" rx="8" fill="#fff" stroke="#d0ddd6"/><text x="498" y="42" font-size="16" font-weight="650" fill="#243b31">Direct</text><text x="498" y="66" font-size="11" fill="#62776d">整任务执行 · 保留工具续接</text><rect x="420" y="156" width="157" height="99" rx="8" fill="#fff7e9" stroke="#e1cbaa"/><text x="498" y="183" font-size="16" font-weight="650" fill="#7c602f">DAG</text><text x="498" y="207" font-size="11" fill="#886e45">规划 → 节点分配 → 汇总</text><text x="498" y="231" font-size="11" fill="#886e45">独立节点可并行调用模型</text><rect x="639" y="87" width="80" height="83" rx="8" fill="#e0f1e9" stroke="#81baa4"/><text x="679" y="119" font-size="13" font-weight="650" fill="#176e51">最终候选</text><text x="679" y="143" font-size="11" fill="#3f725a">按风险审核</text><text x="272" y="237" font-size="11" fill="#62776d">可拆分不等于一定选择 DAG</text></g></svg>
