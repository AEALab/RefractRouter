<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="t d2">
  <title id="t">Escalation 的判别与接管</title>
  <desc id="d2">起始模型候选经过 Judge 判别：PROCEED 放行，DEFECT 或最终轮 STALL 立即接管，工具过程 STALL 连续两次接管，接管后锁定模型不再审核。</desc>
  <defs><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#8aa297" stroke-width="1.6"/></marker></defs>
  <g font-family="system-ui,-apple-system,sans-serif">
    <rect x="250" y="14" width="260" height="60" rx="9" fill="#fff" stroke="#c9d8d0"/>
    <text x="380" y="37" font-size="14" font-weight="650" fill="#243b31" text-anchor="middle">起始模型执行</text>
    <text x="380" y="55" font-size="11" fill="#52605b" text-anchor="middle">候选正文、推理与工具调用全部缓冲</text>
    <rect x="250" y="108" width="260" height="56" rx="9" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="380" y="130" font-size="13" font-weight="650" fill="#176e51" text-anchor="middle">Judge 判别（接管前逐候选）</text>
    <text x="380" y="150" font-size="11" fill="#3f725a" text-anchor="middle">检查任务要求 · 已接受历史 · 工具证据</text>
    <rect x="60" y="204" width="150" height="56" rx="9" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="135" y="226" font-size="12" font-weight="650" fill="#176e51" text-anchor="middle">PROCEED</text>
    <text x="135" y="246" font-size="11" fill="#3f725a" text-anchor="middle">放行 · 清零停滞</text>
    <rect x="235" y="204" width="150" height="56" rx="9" fill="#fff7e9" stroke="#e1cbaa"/>
    <text x="310" y="226" font-size="12" font-weight="650" fill="#7c602f" text-anchor="middle">DEFECT</text>
    <text x="310" y="246" font-size="11" fill="#886e45" text-anchor="middle">立即接管</text>
    <rect x="410" y="204" width="150" height="56" rx="9" fill="#fff7e9" stroke="#e1cbaa"/>
    <text x="485" y="226" font-size="12" font-weight="650" fill="#7c602f" text-anchor="middle">STALL</text>
    <text x="485" y="246" font-size="11" fill="#886e45" text-anchor="middle">连续 2 次或最终轮接管</text>
    <rect x="585" y="204" width="150" height="56" rx="9" fill="#fff7e9" stroke="#e1cbaa"/>
    <text x="660" y="226" font-size="12" font-weight="650" fill="#7c602f" text-anchor="middle">UNCERTAIN</text>
    <text x="660" y="246" font-size="11" fill="#886e45" text-anchor="middle">使用合格接管模型</text>
    <rect x="235" y="300" width="290" height="60" rx="9" fill="#fff" stroke="#c9d8d0"/>
    <text x="380" y="322" font-size="13" font-weight="650" fill="#243b31" text-anchor="middle">接管模型生成（每任务最多一次）</text>
    <text x="380" y="342" font-size="11" fill="#52605b" text-anchor="middle">丢弃起始候选 · 原请求与已接受历史继续</text>
    <rect x="235" y="392" width="290" height="52" rx="9" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="380" y="414" font-size="13" font-weight="650" fill="#176e51" text-anchor="middle">接管后锁定模型</text>
    <text x="380" y="432" font-size="11" fill="#3f725a" text-anchor="middle">不再调用 Judge · 输出可流式交付</text>
    <rect x="60" y="392" width="150" height="52" rx="9" fill="#fff" stroke="#c9d8d0"/>
    <text x="135" y="414" font-size="12" font-weight="650" fill="#243b31" text-anchor="middle">放行交付</text>
    <text x="135" y="432" font-size="11" fill="#52605b" text-anchor="middle">文本与工具调用正常</text>
    <path d="M380 74v30" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ea)"/>
    <path d="M300 164c-60 10 -120 20 -150 36" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ea)"/>
    <path d="M340 164v40" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ea)"/>
    <path d="M420 164v40" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ea)"/>
    <path d="M460 164c60 10 140 20 180 36" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ea)"/>
    <path d="M310 260v36" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ea)"/>
    <path d="M485 260c0 20 -20 30 -40 40" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ea)"/>
    <path d="M660 260c0 30 -100 40 -140 40" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ea)"/>
    <path d="M380 360v28" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ea)"/>
    <path d="M135 260v126" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ea)"/>
  </g>
</svg>
