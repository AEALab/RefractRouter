# 生产入口只启用路由接入；验收工具按需启用，继续保留原稳定 ID。
# 工具、权限、凭证及会话仍由宿主提供。
- insert:
    - id: refractrouter-validation
      name: dsh-refractrouter-validation/validation-tools
      disabled: true
      config:
        allowPaidRuns: false
        billingUnit: USD
        maxProductionCost: 2
        maxEvaluationCost: 1
        maxRetries: 0
    - id: refractagent
      name: dsh-refractrouter-validation
      config:
        entryMode: routing
        executionMode: demo
        allowPaidRuns: false
