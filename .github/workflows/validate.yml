name: Validate v0.1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra deepagents
      - name: Install locked TypeScript dependencies
        run: npm ci --prefix validation/dsh/plugin
      - name: Type check DSH plugin
        run: npm run --prefix validation/dsh/plugin typecheck
      - name: Build DSH plugin
        run: npm run --prefix validation/dsh/plugin build
      - name: Run tests
        run: uv run pytest
      - name: Validate canonical fake-model experiment
        run: >-
          uv run python validation/dsh/canonical_runner.py
          --task data/tasks/report_001.json
          --output-dir "${RUNNER_TEMP}/canonical"
          --evidence "${RUNNER_TEMP}/canonical-evidence.json"
      - name: Validate real-model final preflight
        run: >-
          uv run python validation/dsh/real_runner.py
          --dataset data/benchmarks/v0.1.json
          --manifest data/model-manifests/openai-gpt-5.4.json
          --phase final
          --output-dir "${RUNNER_TEMP}/real-preflight"
          --evidence "${RUNNER_TEMP}/real-preflight-evidence.json"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refractrouter-validation-evidence
          path: |
            ${{ runner.temp }}/canonical-evidence.json
            ${{ runner.temp }}/real-preflight-evidence.json
            ${{ runner.temp }}/real-preflight/preflight.json
          if-no-files-found: warn

  dsh-plugin-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.19.0", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev --extra deepagents
      - name: Install locked TypeScript dependencies
        run: npm ci --prefix validation/dsh/plugin
      - name: Type check, build and test DSH plugin
        run: |
          npm run --prefix validation/dsh/plugin typecheck
          npm test --prefix validation/dsh/plugin
      - name: Install pinned DSH plugin tooling
        run: npm install --global pnpm@10.15.0 @deepseek-ai/dsh@0.1.1-rc.2
      - name: Validate clean-profile plugin lifecycle
        run: python3 scripts/validate_dsh_plugin_lifecycle.py
      - name: Validate packaged plugin lifecycle
        run: python3 scripts/validate_dsh_plugin_lifecycle.py --packed
      - name: Validate installed RefractAgent models without paid calls
        run: python3 scripts/validate_refractagent_install.py --output "${RUNNER_TEMP}/refractagent-install"
      - name: Upload RefractAgent installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refractagent-install-${{ matrix.node-version }}
          path: ${{ runner.temp }}/refractagent-install/acceptance.json
          if-no-files-found: warn
