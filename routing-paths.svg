<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">规划路由与自动路由的执行路径对比</title>
  <desc id="desc">上半部分是规划路由：Agent 每轮调用 Router，Router 逐次选模并审核，Agent 保持原生循环；下半部分是自动路由：任务整体进入 Router，Router 判断 Direct 或 DAG 并独立调度。</desc>
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10" fill="none" stroke="#8aa297" stroke-width="1.6"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,sans-serif">
    <!-- 规划路由 -->
    <rect x="20" y="14" width="720" height="188" rx="12" fill="#f2f7f4" stroke="#c9d8d0"/>
    <text x="36" y="40" font-size="15" font-weight="700" fill="#176e51">规划路由 —— 逐调用选模，Agent 保持原生循环</text>
    <text x="36" y="60" font-size="12" fill="#52605b">Agent 的每一轮模型请求都经过 Router；工具执行、审批、上下文仍由 Agent 自己管理</text>
    <rect x="40" y="82" width="150" height="66" rx="8" fill="#fff" stroke="#c9d8d0"/>
    <text x="115" y="110" font-size="13" font-weight="650" fill="#243b31" text-anchor="middle">Agent 原生循环</text>
    <text x="115" y="130" font-size="11" fill="#52605b" text-anchor="middle">发起模型请求</text>
    <rect x="232" y="82" width="170" height="66" rx="8" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="317" y="106" font-size="13" font-weight="650" fill="#176e51" text-anchor="middle">Python 策略状态机</text>
    <text x="317" y="126" font-size="11" fill="#3f725a" text-anchor="middle">六策略 · 冻结任务状态</text>
    <rect x="444" y="82" width="150" height="66" rx="8" fill="#fff" stroke="#c9d8d0"/>
    <text x="519" y="106" font-size="13" font-weight="650" fill="#243b31" text-anchor="middle">选中模型</text>
    <text x="519" y="126" font-size="11" fill="#52605b" text-anchor="middle">原子预留 → 派发</text>
    <rect x="634" y="82" width="86" height="66" rx="8" fill="#fff" stroke="#c9d8d0"/>
    <text x="677" y="106" font-size="13" font-weight="650" fill="#243b31" text-anchor="middle">真实模型</text>
    <text x="677" y="126" font-size="11" fill="#52605b" text-anchor="middle">流式返回</text>
    <path d="M194 115h34" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ra)"/>
    <path d="M406 115h34" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ra)"/>
    <path d="M598 115h32" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ra)"/>
    <text x="36" y="178" font-size="11" fill="#8aa297">回复经策略判定（放行 / 审核 / 返工 / 接管 / 丢弃）后交还 Agent；已释放文本不被替换</text>

    <!-- 自动路由 -->
    <rect x="20" y="226" width="720" height="222" rx="12" fill="#fbf7ef" stroke="#e1cbaa"/>
    <text x="36" y="252" font-size="15" font-weight="700" fill="#7c602f">自动路由 —— 整任务决策，独立研究入口</text>
    <text x="36" y="272" font-size="12" fill="#886e45">任务整体进入 Router；Router 判断 Direct 或 DAG，必要时规划节点并分配模型</text>
    <rect x="40" y="294" width="140" height="62" rx="8" fill="#fff" stroke="#e1cbaa"/>
    <text x="110" y="318" font-size="13" font-weight="650" fill="#243b31" text-anchor="middle">任务输入</text>
    <text x="110" y="338" font-size="11" fill="#52605b" text-anchor="middle">要求 · 材料 · 预算</text>
    <rect x="212" y="294" width="150" height="62" rx="8" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="287" y="316" font-size="13" font-weight="650" fill="#176e51" text-anchor="middle">拆分判别</text>
    <text x="287" y="336" font-size="11" fill="#3f725a" text-anchor="middle">规则 / 可选 Jev</text>
    <rect x="394" y="294" width="150" height="62" rx="8" fill="#fff" stroke="#c9d8d0"/>
    <text x="469" y="316" font-size="13" font-weight="650" fill="#243b31" text-anchor="middle">路线比较</text>
    <text x="469" y="336" font-size="11" fill="#52605b" text-anchor="middle">Direct vs DAG 成本时延</text>
    <rect x="576" y="270" width="144" height="52" rx="8" fill="#fff" stroke="#c9d8d0"/>
    <text x="648" y="291" font-size="13" font-weight="650" fill="#243b31" text-anchor="middle">Direct</text>
    <text x="648" y="309" font-size="11" fill="#52605b" text-anchor="middle">整任务执行</text>
    <rect x="576" y="334" width="144" height="62" rx="8" fill="#fff7e9" stroke="#e1cbaa"/>
    <text x="648" y="356" font-size="13" font-weight="650" fill="#7c602f" text-anchor="middle">DAG</text>
    <text x="648" y="374" font-size="11" fill="#886e45" text-anchor="middle">节点分配 · 并行调用</text>
    <rect x="394" y="406" width="326" height="36" rx="8" fill="#e0f1e9" stroke="#81baa4"/>
    <text x="557" y="429" font-size="12" font-weight="650" fill="#176e51" text-anchor="middle">自适应最终审核 → 交付</text>
    <path d="M184 325h24" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ra)"/>
    <path d="M366 325h24" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ra)"/>
    <path d="M548 316l24 -12" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ra)"/>
    <path d="M548 334l24 14" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ra)"/>
    <path d="M648 396v10" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ra)"/>
    <path d="M720 296 C 738 298, 738 424, 720 424" stroke="#8aa297" stroke-width="1.8" fill="none" marker-end="url(#ra)"/>
    <text x="36" y="434" font-size="11" fill="#8aa297">标准模型网关不进入这条路径；它只服务规划路由的虚拟模型</text>
  </g>
</svg>
